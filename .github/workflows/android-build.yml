name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android --inline

      - name: Show capacitor.build.gradle after sync
        run: cat android/app/capacitor.build.gradle

      - name: Verify web files copied into APK assets
        run: |
          echo "=== Checking assets ==="
          ls android/app/src/main/assets/
          echo "=== plugins ==="
          cat android/app/src/main/assets/capacitor.plugins.json
          echo "=== index.html ==="
          cat android/app/src/main/assets/public/index.html

      - name: Restore fixed keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore

      - name: Remove corrupt Gradle Wrapper
        run: rm -f android/gradle/wrapper/gradle-wrapper.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          wrapper-validation-enabled: false

      - name: Build with Gradle
        run: |
          cd android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
